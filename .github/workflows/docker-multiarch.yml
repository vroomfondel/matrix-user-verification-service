name: docker-multiarch

# Upstream publishes matrixdotorg/matrix-user-verification-service as amd64 only,
# which is useless on an aarch64 k3s node. The Dockerfile itself is arch-agnostic
# (node:22-slim is multiarch, all deps are pure JS), so this just builds it with
# --platform and pushes a proper manifest list to GHCR.

on:
  workflow_dispatch:
    inputs:
      ref:
        # No default here on purpose: it would shadow DEFAULT_REF below and
        # silently build something else, since inputs.ref wins the fallback.
        # DEFAULT_REF is the single source of truth.
        description: "Tag, branch or commit to build (default: DEFAULT_REF)"
        required: false
      tag_latest:
        description: "Also push :latest"
        type: boolean
        default: true
  schedule:
    # Weekly rebuild of the pinned ref so node:22-slim security updates land.
    - cron: "17 4 * * 1"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/matrix-user-verification-service
  # This fork's master: the UVS_HOMESERVERS patch on top of upstream c5a66272.
  # A branch, not a commit -- what ships is whatever we merged here, and
  # pinning our own HEAD would only mean bumping this line on every patch.
  # The exact commit built is still recorded, as the image's git-<sha> tag.
  #
  # Deliberately NOT the v3.0.0 tag: newest release though it is (2023-07), it
  # builds FROM node:18-slim, EOL since April 2025 and no longer receiving base
  # image updates -- which would make the weekly rebuild below pointless.
  # Upstream cut no release after that ("Modernize for 2025" merged 2025-10-06
  # is its newest code).
  DEFAULT_REF: master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve build ref
        id: ref
        run: echo "value=${{ inputs.ref || env.DEFAULT_REF }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.value }}

      # After checkout, so the tag names the commit actually built even when
      # the ref was a branch. Whatever ref was asked for, every build stays
      # addressable by its commit.
      - name: Derive image tags
        id: cfg
        run: |
          SHA="$(git rev-parse --short=12 HEAD)"
          TAGS="${IMAGE}:git-${SHA}"
          # inputs.tag_latest is empty on schedule runs -> default to tagging latest
          if [ "${{ inputs.tag_latest }}" != "false" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Building $(git rev-parse HEAD) from ref ${{ steps.ref.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.cfg.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Keep the manifest list to exactly the two arch entries; the extra
          # provenance/attestation manifests confuse some older pull tooling.
          provenance: false
