name: docker-multiarch

# Upstream publishes matrixdotorg/matrix-user-verification-service as amd64 only,
# which is useless on an aarch64 k3s node. The Dockerfile itself is arch-agnostic
# (node:22-slim is multiarch, all deps are pure JS), so this just builds it with
# --platform and pushes a proper manifest list to GHCR.

on:
  workflow_dispatch:
    inputs:
      ref:
        # No default here on purpose: it would shadow DEFAULT_REF below and
        # silently build something else, since inputs.ref wins the fallback.
        # DEFAULT_REF is the single source of truth.
        description: "Tag, branch or commit to build (default: DEFAULT_REF)"
        required: false
      tag_latest:
        description: "Also push :latest"
        type: boolean
        default: true
  schedule:
    # Weekly rebuild of the pinned ref so node:22-slim security updates land.
    - cron: "17 4 * * 1"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/matrix-user-verification-service
  # Our own master: the UVS_HOMESERVERS patch on top of upstream c5a66272.
  #
  # Deliberately NOT the v3.0.0 tag: newest release though it is (2023-07), it
  # builds FROM node:18-slim, EOL since April 2025 and no longer receiving base
  # image updates -- which would make the weekly rebuild below pointless.
  # Upstream cut no release after that ("Modernize for 2025" merged 2025-10-06
  # is the newest code), so master is the only sane base.
  #
  # Pinned by commit rather than by branch name so a build stays reproducible;
  # bump this when the fork gains commits that should ship.
  DEFAULT_REF: 8b67d4878d6f13fc0b781ad0f31dc4e00e5a7adc

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve build ref and tags
        id: cfg
        run: |
          REF="${{ inputs.ref || env.DEFAULT_REF }}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          # A full 40-char SHA makes for a useless image tag, so shorten it;
          # branch/tag refs are used verbatim.
          case "$REF" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*)
              [ ${#REF} -eq 40 ] && VERSION_TAG="git-${REF:0:12}" || VERSION_TAG="$REF" ;;
            *) VERSION_TAG="$REF" ;;
          esac
          TAGS="${IMAGE}:${VERSION_TAG}"
          # inputs.tag_latest is empty on schedule runs -> default to tagging latest
          if [ "${{ inputs.tag_latest }}" != "false" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.cfg.outputs.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.cfg.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Keep the manifest list to exactly the two arch entries; the extra
          # provenance/attestation manifests confuse some older pull tooling.
          provenance: false
